<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREDATOR // ZERO-G ARENA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="race.css?v=1.1">
</head>
<body>
    <div class="overlay"></div>
    <canvas id="race-canvas"></canvas>

    <div class="hud-container">
        <div class="hud-header">
            <div class="system-title">
                <h1 class="glitch-text" style="font-size: 35px;">MANDALIKA GP</h1>
                <div style="letter-spacing: 3px; opacity: 0.8; font-size: 12px;">PERTAMINA MANDALIKA INTERNATIONAL CIRCUIT // LOMBOK, INDONESIA</div>
            </div>
            
            <div class="leaderboard-v3">
                <div style="font-size: 12px; opacity: 0.5; margin-bottom: 10px;">>> TOP SECTOR HUNTERS</div>
                <div id="rank-list">
                    <!-- Ranks here -->
                </div>
            </div>
        </div>

        <div class="hud-footer" style="display: flex; justify-content: space-between; align-items: flex-end;">
            <div style="color: var(--plasma-green); font-size: 14px; border: 1px solid var(--plasma-green); padding: 10px;">
                STATUS: RUNNING // AI_ORACLE_ACTIVE
            </div>
            <div style="text-align: right; opacity: 0.5; font-size: 10px;">
                MOMENTUM SCALE: 1 UNIT = 0.01% CHANGE<br>
                AUTO-SENSITIVITY: ENABLED
            </div>
        </div>
    </div>

    <script src="race.js"></script>
</body>
</html>
