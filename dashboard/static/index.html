<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantitative Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- TOP NAV: Metrics -->
        <header class="top-nav">
            <div class="logo-section">
                <span class="logo-title">QUANTITATIVE DASHBOARD</span>
            </div>
            <div class="global-metrics">
                <div class="metric-card">
                    <span class="label">Daily PnL</span>
                    <span class="value" id="daily-pnl">$0.00</span>
                </div>
                <div class="metric-card">
                    <span class="label">Win Rate</span>
                    <span class="value" id="win-rate">0.0%</span>
                </div>
                <div class="metric-card">
                    <span class="label">Executions</span>
                    <span class="value" id="total-trades">0</span>
                </div>
                <div class="metric-card">
                    <span class="label">Market Regime</span>
                    <span class="value" id="market-regime">ANALYZING</span>
                </div>
            </div>
        </header>

        <main class="main-layout">
            <!-- LEFT SIDEBAR: Logs & Stream -->
            <aside class="left-sidebar">
                <div class="panel log-panel">
                    <div class="panel-header">System Events</div>
                    <div class="log-container" id="ai-logs">
                        <!-- Logs populated by JS -->
                    </div>
                </div>
                <div class="panel stream-panel">
                    <div class="panel-header">
                        <span><span class="live-dot"></span>Live Stream</span>
                    </div>
                    <div class="stream-container" id="ws-stream">
                        <!-- Raw data populated by JS -->
                    </div>
                </div>
            </aside>

            <!-- CENTER AREA -->
            <section class="center-area">
                <!-- Top Center: Watchlist + Chart -->
                <div class="top-center">
                    <div class="panel watchlist-panel">
                        <div class="panel-header">Watchlist</div>
                        <div class="ticker-list" id="ticker-list">
                            <!-- Tickers populated by JS -->
                        </div>
                    </div>
                    <div class="panel chart-panel">
                        <div class="chart-header">
                            <div class="chart-title-area">
                                <h2 id="active-pair">SELECT PAIR</h2>
                                <div class="chart-subtitle" id="pair-details">Awaiting selection</div>
                            </div>
                        </div>
                        <div id="chart-canvas">
                            <canvas id="custom-chart"></canvas>
                            <div id="chart-tooltip" class="chart-tooltip"></div>
                        </div>
                    </div>
                </div>

                <!-- Bottom Center: Trade History -->
                <div class="panel history-panel">
                    <div class="panel-header">Execution Ledger</div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Ticker</th>
                                    <th>Logic</th>
                                    <th>Profit/Loss</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="trade-history-body">
                                <!-- Trades populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
