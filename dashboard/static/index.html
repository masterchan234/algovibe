<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREDATOR // PROFESSIONAL HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- TOP NAV: Global Stats -->
        <header class="top-nav">
            <div class="logo">
                <span class="glitch" data-text="PREDATOR">PREDATOR</span>
                <span class="sub-logo">QUANT ENGINE v4.0</span>
            </div>
            <div class="global-metrics">
                <div class="metric-card">
                    <span class="label">DAILY PNL</span>
                    <span class="value" id="daily-pnl">Rp 0</span>
                </div>
                <div class="metric-card">
                    <span class="label">WIN RATE</span>
                    <span class="value accent" id="win-rate">0%</span>
                </div>
                <div class="metric-card">
                    <span class="label">EXECUTIONS</span>
                    <span class="value" id="total-trades">0</span>
                </div>
                <div class="metric-card">
                    <span class="label">REGIME</span>
                    <span class="value" id="market-regime">CHOPPY</span>
                </div>
            </div>
        </header>

        <main class="main-layout">
            <!-- SIDEBAR: Watchlist -->
            <aside class="watchlist">
                <div class="panel-header">WATCHLIST</div>
                <div class="ticker-list" id="ticker-list">
                    <!-- Tickers populated by JS -->
                </div>
            </aside>

            <!-- CENTER: Chart & History -->
            <section class="center-panel">
                <div class="chart-container" id="chart-area">
                    <div class="chart-header">
                        <h2 id="active-pair">SELECT A PAIR</h2>
                        <div class="chart-controls">
                            <span class="badge" id="pair-trend">N/A</span>
                            <span class="badge" id="pair-prob">0% PROB</span>
                        </div>
                    </div>
                    <div id="chart-canvas"></div>
                </div>
                <div class="trade-history-panel">
                    <div class="panel-header">RECENT TRANSACTIONS</div>
                    <table class="trade-table">
                        <thead>
                            <tr>
                                <th>TIME</th>
                                <th>PAIR</th>
                                <th>TYPE</th>
                                <th>PROFIT</th>
                                <th>REASON</th>
                            </tr>
                        </thead>
                        <tbody id="trade-history-body">
                            <!-- Trades populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- RIGHT: AI Logs & Stream -->
            <aside class="intel-panel">
                <div class="panel-header">AI INTEL & WHALE ALERTS</div>
                <div class="log-container" id="ai-logs">
                    <!-- Logs populated by JS -->
                </div>
                <div class="panel-header mt-20">LIVE WEBSOCKET STREAM</div>
                <div class="stream-container" id="ws-stream">
                    <!-- Raw data populated by JS -->
                </div>
            </aside>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
