<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA & theme -->
    <meta name="theme-color" content="#a371f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AlgoVibe" />
    <meta name="description" content="Crypto scalping bot dashboard — simulation &amp; live modes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <title>AlgoVibe — Futuristic AI-Powered Crypto Scalping Terminal</title>
    <meta name="description" content="Algovibe is a next-generation crypto scalping terminal driven by real-time AI reasoning and predictive market telemetry. Professional-grade execution for elite operators." />
    <meta name="keywords" content="crypto trading, ai trading bot, indodax bot, crypto scalping, market telemetry, algovibe, automated trading" />
    <meta name="author" content="AlgoVibe Quant Team" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://algovibe.yukbisayuk.id/" />
    <meta property="og:title" content="AlgoVibe — Futuristic AI-Powered Trading Terminal" />
    <meta property="og:description" content="Real-time AI insights, high-frequency scalping, and predictive market analysis. Elevate your trading with Algovibe." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="AlgoVibe — Futuristic AI-Powered Trading Terminal" />
    <meta property="twitter:description" content="Elite crypto scalping driven by AI reasoning." />
    <meta property="twitter:image" content="/icon-512.png" />

    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Mobile native base styles: prevent overscroll bounce, safe area -->
    <style>
      html, body {
        height: 100%;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: pan-y;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(() => console.log('[SW] AlgoVibe service worker registered'))
            .catch((err) => console.warn('[SW] Registration failed:', err))
        })
      }
    </script>

    <!-- Pull-to-Refresh (mobile native feel) -->
    <script src="/pull_to_refresh.js" defer></script>
  </body>
</html>
