    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Mobile native base styles: prevent overscroll bounce, safe area -->
    <style>
      html, body {
        height: 100%;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: pan-y;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[SW] AlgoVibe service worker registered')
              registration.update()

              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' })
              }

              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing
                if (!newWorker) return
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' })
                  }
                })
              })

              let refreshing = false
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return
                refreshing = true
                window.location.reload()
              })
            })
            .catch((err) => console.warn('[SW] Registration failed:', err))
        })
      }
    </script>

    <!-- Pull-to-Refresh (mobile native feel) -->
    <script src="/pull_to_refresh.js" defer></script>
  </body>
</html>
