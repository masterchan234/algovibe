<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA & theme -->
    <meta name="theme-color" content="#a371f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AlgoVibe" />
    <meta name="description" content="Crypto scalping bot dashboard — simulation &amp; live modes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <title>AlgoVibe Dashboard</title>

    <!-- Mobile native base styles: prevent overscroll bounce, safe area -->
    <style>
      html, body {
        height: 100%;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: pan-y;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(() => console.log('[SW] AlgoVibe service worker registered'))
            .catch((err) => console.warn('[SW] Registration failed:', err))
        })
      }
    </script>

    <!-- Pull-to-Refresh (mobile native feel) -->
    <script src="/pull_to_refresh.js" defer></script>
  </body>
</html>
