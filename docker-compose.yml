services:

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: algovibe-timescaledb
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=algovibe
      - POSTGRES_PASSWORD=secretpassword
    volumes:
      - algovibe_pgdata:/var/lib/postgresql/data
      - ./init-pg.sh:/docker-entrypoint-initdb.d/init-pg.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algovibe"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - default

  # ─────────────────────────────────────────────────────────────────────────────
  # [Init Service] Model Downloader
  # Tugas satu kali: Download model AI ke volume algovibe_models.
  # Bot hanya akan start SETELAH service ini selesai (condition: service_completed_successfully).
  # Jika model sudah ada di volume, service ini langsung exit 0 tanpa download ulang.
  # ─────────────────────────────────────────────────────────────────────────────
  model-downloader:
    image: alpine:3.19                 # Alpine includes sh + wget, jauh lebih fleksibel
    container_name: algovibe-model-init
    restart: "no"                      # Hanya jalan sekali, tidak restart
    user: root                         # Diperlukan untuk menulis ke named volume baru
    volumes:
      - algovibe_models:/models        # Share volume dengan service utama
    environment:
      - MODEL_FILE=/models/gemma-4-E2B-it.litertlm
      - MODEL_URL=https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm
      - MODEL_EXPECTED_SIZE=2583085056
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /models/cache

        if [ -f "$$MODEL_FILE" ]; then
          ACTUAL_SIZE=$$(wc -c < "$$MODEL_FILE" 2>/dev/null || echo 0)
          if [ "$$ACTUAL_SIZE" -ge "$$MODEL_EXPECTED_SIZE" ]; then
            echo "[model-init] ✅ Model sudah ada di volume ($$ACTUAL_SIZE bytes). Skip download."
            exit 0
          fi
          echo "[model-init] ⚠️  Model tidak valid ($$ACTUAL_SIZE/$$MODEL_EXPECTED_SIZE). Re-download..."
          rm -f "$$MODEL_FILE"
        fi

        echo "[model-init] ⬇️  Mulai download model AI (~2.5GB)..."
        DOWNLOADED=0
        for attempt in 1 2 3; do
          echo "[model-init] Attempt $$attempt/3..."
          if wget -q -T 60 -O "$$MODEL_FILE" "$$MODEL_URL"; then
            ACTUAL_SIZE=$$(wc -c < "$$MODEL_FILE" 2>/dev/null || echo 0)
            if [ "$$ACTUAL_SIZE" -ge "$$MODEL_EXPECTED_SIZE" ]; then
              echo "[model-init] ✅ Download selesai! Size: $$ACTUAL_SIZE bytes."
              DOWNLOADED=1
              break
            fi
            echo "[model-init] ⚠️  File tidak valid ($$ACTUAL_SIZE/$$MODEL_EXPECTED_SIZE). Retry..."
          else
            echo "[model-init] ⚠️  wget gagal pada attempt $$attempt. Retry..."
          fi
          rm -f "$$MODEL_FILE"
        done

        if [ "$$DOWNLOADED" -ne 1 ]; then
          echo "[model-init] ❌ Gagal download model setelah 3 percobaan."
          exit 1
        fi

  # ─────────────────────────────────────────────────────────────────────────────
  # [Microservice 1] market-pipe — Market Data Ingress
  # Connects to Indodax WebSocket, normalises ticks into Protobuf, and
  # publishes to ipc:///tmp/market_stream.ipc via ZMQ PUB socket.
  # network_mode: host gives the lowest possible latency for exchange WebSocket.
  # ─────────────────────────────────────────────────────────────────────────────
  market-pipe:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-market-pipe
    restart: unless-stopped
    stop_grace_period: 15s
    network_mode: host             # Bypass Docker NAT for minimum WS latency
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # network_mode:host tidak bisa pakai Docker internal DNS (timescaledb),
      # gunakan localhost karena port 5432 di-publish ke host.
      - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@localhost:5432/algovibe_live
      - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@localhost:5432/algovibe_dryrun
    volumes:
      - algovibe_data:/app/data
      - algovibe_ipc:/tmp           # Shared IPC volume for ZMQ sockets
      - ./services:/app/services
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
    shm_size: 256mb
    command: ["python", "-m", "services.market_pipe.main"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import zmq; c=zmq.Context(); s=c.socket(zmq.SUB); s.RCVTIMEO=2000; s.setsockopt(zmq.SUBSCRIBE,b''); s.connect('ipc:///tmp/market_stream.ipc'); s.recv(); s.close(); c.term()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        mode: "non-blocking"
        max-buffer-size: "4m"
        max-size: "5m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────────
  # [Microservice 2] executive-core — Brain & Muscle
  # Subscribes to market ticks + equity updates.
  # Runs Net-Zero Survival Guard and Profit Lock.
  # Places all API orders as high-priority async tasks.
  # Persists state to SQLite (WAL mode).
  # ─────────────────────────────────────────────────────────────────────────────
  executive-core:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-executive-core
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      timescaledb:
        condition: service_healthy
      market-pipe:
        condition: service_started
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_live
      - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_dryrun
      - DATABASE_URL_BACKTEST=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe
      - MIGRATION_PRIMARY=true
      - MODEL_PATH=/tmp/disabled_model
    volumes:
      - algovibe_data:/app/data
      - algovibe_ipc:/tmp           # Same IPC volume as market-pipe
      - ./models:/app/scalp_models:ro  # Per-pair RandomForest scalp classifiers
      - ./services:/app/services
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    shm_size: 256mb
    # Elevate CPU priority so exit logic is never starved
    cpu_shares: 2048               # 2× the default 1024 — highest priority among services
    command: ["python", "-m", "services.executive_core.main"]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import os; f=open('data/algovibe_bot.pid'); pid=int(f.read()); os.kill(pid,0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        mode: "non-blocking"
        max-buffer-size: "4m"
        max-size: "5m"
        max-file: "3"
    networks:
      - default

  # ─────────────────────────────────────────────────────────────────────────────
  # [Microservice 3] brain-inference — AI / Oracle Inference
  # Runs Oracle + XGBoost scoring and publishes Signal messages to
  # ipc:///tmp/signal_stream.ipc.
  # ─────────────────────────────────────────────────────────────────────────────
  brain-inference:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-brain-inference
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      timescaledb:
        condition: service_healthy
      model-downloader:
        condition: service_completed_successfully
      market-pipe:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_live
      - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_dryrun
      - DATABASE_URL_BACKTEST=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe
      - GLOG_minloglevel=2          # Suppress C++ glog WARNING from litert/MediaPipe (mel_filterbank etc.)
      - MODEL_PATH=/tmp/disabled_model
    volumes:
      - algovibe_data:/app/data
      - algovibe_models:/app/models
      - ./models:/app/scalp_models:ro  # Per-pair RandomForest scalp classifiers
      - algovibe_ipc:/tmp           # Same IPC volume
      - ./services:/app/services
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
    shm_size: 256mb
    command: ["python", "-m", "services.brain_inference.main"]
    logging:
      driver: "json-file"
      options:
        mode: "non-blocking"
        max-buffer-size: "4m"
        max-size: "5m"
        max-file: "3"
    networks:
      - default

  # ─────────────────────────────────────────────────────────────────────────────
  # [Microservice] exchange-reconcile — Exchange → DB state reconciler
  # Periodically runs ExitManager.reconcile_with_exchange() to keep bot/live
  # dashboard state aligned with wallet + open-order reality on exchange.
  # ─────────────────────────────────────────────────────────────────────────────
  exchange-reconcile:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-exchange-reconcile
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      timescaledb:
        condition: service_healthy
      executive-core:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_live
      - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_dryrun
      - RECONCILE_INTERVAL_SEC=${RECONCILE_INTERVAL_SEC:-10}
      - RECONCILE_STARTUP_DELAY_SEC=${RECONCILE_STARTUP_DELAY_SEC:-20}
    volumes:
      - algovibe_data:/app/data
      - ./services:/app/services
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    shm_size: 256mb
    command: ["python", "-m", "services.exchange_reconcile.main"]
    logging:
      driver: "json-file"
      options:
        mode: "non-blocking"
        max-buffer-size: "4m"
        max-size: "5m"
        max-file: "3"
    networks:
      - default

  # ─────────────────────────────────────────────────────────────────────────────
  # [Service] backtester
  # Download OHLCV 90-hari dari Indodax ke DB `algovibe`, lalu jalankan
  # backtest 1:1 terhadap bot logic untuk semua active backtest_profiles.
  # Command: fetch | run | all
  # Default: idle (restart=no) — trigger manual via:
  #   docker compose run --rm backtester all
  # ─────────────────────────────────────────────────────────────────────────────
  backtester:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-backtester
    restart: "no"
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_live
      - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_dryrun
      - DATABASE_URL_BACKTEST=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe
    volumes:
      - algovibe_data:/app/data
      - ./services:/app/services
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
      - ./alembic_backtest:/app/alembic_backtest
      - ./alembic_backtest.ini:/app/alembic_backtest.ini
    shm_size: 128mb
    entrypoint: ["python", "-m", "services.backtester.main"]
    command: ["all"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  # ─────────────────────────────────────────────────────────────────────────────
  # [Microservice 4] litert-lm-decision — Grounded LLM Exit Signals
  # Reads open-position context (technical + orderbook + fee + PnL),
  # then publishes SELL signals for ExitManager execution.
  # ─────────────────────────────────────────────────────────────────────────────
  # litert-lm-decision:
  #   image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
  #   container_name: algovibe-litert-lm-decision
  #   restart: unless-stopped
  #   stop_grace_period: 15s
  #   depends_on:
  #     timescaledb:
  #       condition: service_healthy
  #     model-downloader:
  #       condition: service_completed_successfully
  #     market-pipe:
  #       condition: service_healthy
  #     executive-core:
  #       condition: service_started
  #   env_file:
  #     - .env
  #   environment:
  #     - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_live
  #     - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_dryrun
  #     - GLOG_minloglevel=2          # Suppress C++ glog WARNING from litert/MediaPipe (mel_filterbank etc.)
  #     - MODEL_PATH=/tmp/disabled_model
  #   volumes:
  #     - algovibe_data:/app/data
  #     - algovibe_models:/app/models
  #     - algovibe_ipc:/tmp
  #     - ./services:/app/services
  #     - ./app:/app/app
  #     - ./shared:/app/shared
  #     - ./utils:/app/utils
  #     - ./config.py:/app/config.py
  #   shm_size: 256mb
  #   command: ["python", "-m", "services.litert_lm_decision.main"]
  #   logging:
  #     driver: "json-file"
  #     options:
  #       mode: "non-blocking"
  #       max-buffer-size: "4m"
  #       max-size: "5m"
  #       max-file: "3"
  #   networks:
  #     - default

  news-maker:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-news-maker
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      timescaledb: { condition: service_healthy }
      model-downloader: { condition: service_completed_successfully }
      market-pipe: { condition: service_healthy }
      brain-inference: { condition: service_started }
    env_file: [.env]
    environment:
      - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_live
      - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_dryrun
      - DATABASE_URL_BACKTEST=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe
      - MODEL_PATH=/app/models/gemma-4-E2B-it.litertlm
      - NEWS_LLM_PROVIDER=${NEWS_LLM_PROVIDER:-local}
      - NEWS_REMOTE_TIMEOUT_SEC=${NEWS_REMOTE_TIMEOUT_SEC:-60}
      - NEWS_HF_API_URL=${NEWS_HF_API_URL:-}
      - NEWS_HF_API_TOKEN=${NEWS_HF_API_TOKEN:-}
      - NEWS_CF_API_URL=${NEWS_CF_API_URL:-}
      - NEWS_CF_API_TOKEN=${NEWS_CF_API_TOKEN:-}
    volumes:
      - algovibe_data:/app/data
      - algovibe_models:/app/models
      - algovibe_ipc:/tmp
      - ./generate_news.sh:/app/generate_news.sh
      - ./services:/app/services
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
    shm_size: 256mb
    command: ["python", "-m", "services.news_maker.main"]
    logging:
      driver: "json-file"
      options:
        mode: "non-blocking"
        max-buffer-size: "4m"
        max-size: "5m"
        max-file: "3"
    networks:
      - default

  # ─────────────────────────────────────────────────────────────────────────────
  # [Microservice 5] dashboard-api — Flask REST + SocketIO Dashboard
  # Serves the Vue.js SPA and exposes /api/* endpoints.
  # Read-only view of the shared SQLite DB.
  # ─────────────────────────────────────────────────────────────────────────────
  dashboard-api:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-dashboard
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      timescaledb:
        condition: service_healthy
      executive-core:
        condition: service_started
      exchange-reconcile:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_live
      - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_dryrun
      - DATABASE_URL_BACKTEST=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe
    ports:
      - "8080:8080"
    volumes:
      - algovibe_data:/app/data
      - algovibe_ipc:/tmp           # Subscribe to equity stream for live gauges
      - ./dashboard/server.py:/app/dashboard/server.py
      - ./dashboard/static/dist:/app/dashboard/static/dist
      - ./services:/app/services
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
    command: ["python", "-m", "dashboard.server"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        mode: "non-blocking"
        max-buffer-size: "4m"
        max-size: "5m"
        max-file: "3"
    networks:
      - default
      - npm_external

  redis:
    image: redis:alpine
    container_name: algovibe-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - algovibe_redis_data:/data
    networks:
      - default

  knn-worker:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-knn-worker
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL_LIVE=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_live
      - DATABASE_URL_DRYRUN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe_dryrun
      - DATABASE_URL_BACKTEST=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - algovibe_data:/app/data
      - ./models:/app/models
      - ./services:/app/services
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
    command: ["python", "-m", "services.knn_worker.main"]
    networks:
      - default

  auto-trainer:
    image: ${REGISTRY_IP:-80.241.217.181}:5000/algovibe:latest
    container_name: algovibe-auto-trainer
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL_BACKTEST=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe
      - DATABASE_URL_TRAIN=postgresql://algovibe:secretpassword@timescaledb:5432/algovibe
    volumes:
      - algovibe_data:/app/data
      - ./models:/app/models
      - ./app:/app/app
      - ./shared:/app/shared
      - ./utils:/app/utils
      - ./config.py:/app/config.py
    command: ["python", "-m", "app.infrastructure.auto_trainer"]
    networks:
      - default

networks:
  default:
    driver: bridge
  npm_external:
    external: true
    name: npm_default

volumes:
  algovibe_data:
  algovibe_models:
  algovibe_pgdata:
  algovibe_redis_data:
  # Shared /tmp volume — mounts as /tmp in every service so ZMQ IPC sockets
  # (ipc:///tmp/*.ipc) are accessible across all containers.
  # Security: this is a Docker-managed named tmpfs volume, NOT the host /tmp.
  # Only services that explicitly mount algovibe_ipc can reach the IPC sockets,
  # isolating them from any other processes running on the host.
  algovibe_ipc:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=1777"

