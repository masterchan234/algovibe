services:
  algovibe:
    build: .
    container_name: algovibe_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./scalper.log:/app/scalper.log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
