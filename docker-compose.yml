services:
  algovibe:
    image: 80.241.217.181:5000/algovibe:latest
    container_name: algovibe
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:5000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
